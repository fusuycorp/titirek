name: Build, Push and Deploy HepYeni

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changed Paths
    # OCocuk dedicated builder (see selfhosted/docs/selfhosted-build.md).
    runs-on: [self-hosted, builder]
    outputs:
      pocketbase: ${{ steps.filter.outputs.pocketbase }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect PocketBase-relevant Changes
        id: filter
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # Manual dispatch, or no prior commit to diff against (first push /
            # force-push edge case) — rebuild the PocketBase image to be safe.
            echo "pocketbase=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(pb_migrations/|Dockerfile\.pocketbase$)'; then
            echo "pocketbase=true" >> "$GITHUB_OUTPUT"
          else
            echo "pocketbase=false" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Build & Push App Image
    # OCocuk dedicated builder (see selfhosted/docs/selfhosted-build.md).
    runs-on: [self-hosted, builder]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Custom Registry
        uses: docker/login-action@v4
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: registry.bogazici.app/budok/hepyeni
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # No type=gha cache: OCocuk's local BuildKit layer cache persists
          # on NVMe across runs. No forced gzip compression either: pushes
          # route over the Hetzner LAN (10.34.0.4) via /etc/hosts, bypassing
          # Cloudflare's 100MB request-body limit entirely.

  build-pocketbase:
    name: Build & Push PocketBase Image
    needs: changes
    if: needs.changes.outputs.pocketbase == 'true'
    # OCocuk dedicated builder (see selfhosted/docs/selfhosted-build.md).
    runs-on: [self-hosted, builder]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Custom Registry
        uses: docker/login-action@v4
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: registry.bogazici.app/budok/hepyeni-pb
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.pocketbase
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Same as build-app: local BuildKit cache, LAN push, no Cloudflare
          # ceiling — so no gha cache and no forced compression.

  deploy:
    name: Trigger Dokploy Redeployment
    needs: [build-app, build-pocketbase]
    # build-pocketbase is conditionally skipped (see `changes` job) when this
    # push doesn't touch pb_migrations/**  or Dockerfile.pocketbase — that
    # must not block deploy. It must still block deploy if it actually ran
    # and failed, which is why this can't just be the default `needs`
    # success check (a skipped dependency fails that check).
    if: |
      always() &&
      needs.build-app.result == 'success' &&
      (needs.build-pocketbase.result == 'success' || needs.build-pocketbase.result == 'skipped')
    # OCocuk dedicated builder (see selfhosted/docs/selfhosted-build.md).
    runs-on: [self-hosted, builder]
    steps:
      - name: Trigger Dokploy Stack Redeployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL || 'https://dokploy.bogazici.app' }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY || secrets.DOKPLOY_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID || 'JaE0kGmEj-XgCSnA4ArFW' }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::error::DOKPLOY_API_KEY (or DOKPLOY_KEY) secret is not configured in organization or repository secrets."
            exit 1
          fi
          echo "Triggering Dokploy redeployment for Compose ID: $DOKPLOY_COMPOSE_ID at $DOKPLOY_URL..."

          # Attempt 1: Standard REST API (/api/compose.redeploy)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/compose.redeploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Dokploy redeployment triggered successfully via REST API! (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 0
          fi

          echo "Attempt 1 returned HTTP $HTTP_CODE: $BODY"
          echo "Attempt 2: Trying tRPC wrapped payload format..."

          # Attempt 2: tRPC Wrapped Payload Format
          TRPC_RESP=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/compose.redeploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"json\": {\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}}")

          TRPC_CODE=$(echo "$TRPC_RESP" | tail -n 1)
          TRPC_BODY=$(echo "$TRPC_RESP" | sed '$d')

          if [ "$TRPC_CODE" -ge 200 ] && [ "$TRPC_CODE" -lt 300 ]; then
            echo "✅ Dokploy redeployment triggered successfully via tRPC API! (HTTP $TRPC_CODE)"
            echo "$TRPC_BODY"
            exit 0
          fi

          echo "Attempt 2 returned HTTP $TRPC_CODE: $TRPC_BODY"
          echo "::error::All Dokploy API attempts failed."
          echo "REST API (HTTP $HTTP_CODE): $BODY"
          echo "tRPC API (HTTP $TRPC_CODE): $TRPC_BODY"
          exit 1
