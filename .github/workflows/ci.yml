name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test
    # OCocuk dedicated builder (see selfhosted/docs/selfhosted-build.md).
    runs-on: [self-hosted, builder]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun test

      # next build generates .next/types, which a standalone `tsc --noEmit`
      # needs to resolve route-level types (e.g. LayoutProps); otherwise the
      # typecheck reports a phantom error on fresh checkouts.
      # Bun 1.3.14 segfaults on exit after a successful build (same quirk
      # the Dockerfile works around) — gate on the artifact, not the exit.
      - name: Production Build
        run: bun --bun next build; test -f .next/standalone/server.js

      - name: Typecheck
        run: bun x tsc --noEmit

  lint:
    name: lint
    # OCocuk dedicated builder (see selfhosted/docs/selfhosted-build.md).
    runs-on: [self-hosted, builder]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
